<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Assignment 6</title>
</head>
<body>
           <h1>Job Application Form</h1>
    <form>
        <fieldset>
            <legend>Personal Information</legend>
            <label for="name">Name:</label>
            <input type="text" placeholder="enter full name" required> <br> <br>
            <label for="email">Email:</label>
            <input type="email" placeholder="abc@gmial.com" required> <br> <br>
            <label for="phone">Phone:</label>
            <input type="number" placeholder="03xxxxxxxxx" required> <br> <br>
            <label for="website">Website:</label>
            <input type="url" placeholder="URL/Link" required> <br> <br>
            <label for="DOB">DOB:</label>
            <input type="datetime-local" name="DOB" id="DOB"> <br> <br>
        </fieldset>

        <fieldset>
            <legend>Job Details</legend>
            <label for="jobPosition">Job Position:</label>
            <select name="jobPosition" id="jobPosition">
                <option value="jobPosition">Frontend Developer</option>
                <option value="jobPosition">Backend Developer</option>
                <option value="jobPosition">UI/UX Designer</option>
                <option value="jobPosition">QA Engineer</option>
            </select>   <br> <br>

            <label for="workLocation">Prefered Work Location:</label>
            <input type="radio" name="workLocation" id="on-site">
            <label for="on-site">On-Site</label>

            <input type="radio" name="workLocation" id="remote">
            <label for="remote">Remote</label>

            <input type="radio" name="workLocation" id="hybrid">
            <label for="hybrid">Hybrid</label>
             <br> <br>

             <label for="skills">Skills:</label>

             <input type="checkbox" name="skills" id="html">
             <label for="html">HTML</label>
             <input type="checkbox" name="skills" id="css">
             <label for="css">CSS</label>
             <input type="checkbox" name="skills" id="JavaScript">
             <label for="JavaScript">JavaScript</label>
             <input type="checkbox" name="skills" id="react">
             <label for="react">React</label>
             <input type="checkbox" name="skills" id="nodejs">
             <label for="nodejs">Node.js</label> <br> <br>
             <label for="files">Upload Files:</label>
             <input type="file" name="files" id="files" multiple> <br> <br>
             <label for="about">Write About Yourself:</label> <br>
             <textarea name="about" id="about" rows="4" cols="50"></textarea>
        </fieldset>

        <fieldset>
            <legend>Extra Section</legend>
            <label for="fav-tech">Search for your favourite tech stack:</label>
            <input type="search" placeholder="search here"> <br> <br>
            <label for="password">Password:</label> 
            <input type="password" required> <br> <br>
            <label for="password">Confirm Password:</label> 
            <input type="password" required>

        </fieldset>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
